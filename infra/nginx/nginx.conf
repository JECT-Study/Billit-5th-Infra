# JECT 공통 nginx.conf (운영 진입점과 개발 게이트웨이 공용)
user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # 쿼리 문자열·쿠키·Authorization·본문을 남기지 않는다. $uri는 쿼리를 제외한 정규화 경로다.
    # 경로 자체에 토큰을 넣는 API(공유 링크 등)는 앱 설계 때 경로 마스킹을 추가한다.
    log_format ject_json escape=json
      '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
      '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout ject_json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 15m;   # 영수증 이미지 업로드 기준 초기값
    # 영수증 인식 경로의 동시 업로드 수를 서버 블록마다 묶는다. 이미지를 15MB 버퍼로 메모리에 받으므로
    # 동시 4개(60MB)로 Nginx 컨테이너 메모리 한도(128MB)를 넘지 않게 한다. 넘치면 앱과 같은 JSON 503을 준다.
    limit_conn_zone $server_name zone=receipt_upload:1m;
    limit_conn_status 503;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Docker 내장 DNS로 컨테이너 이름을 주기적으로 다시 조회한다(앱 컨테이너 교체 후 IP 변경 대응).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 개발 게이트웨이용: 앞단(운영 Nginx)이 넣은 X-Forwarded-Proto(https)를 그대로 넘긴다. 없으면 자기 scheme.
    # 운영 진입점(edge)은 이 값을 쓰지 않는다(클라이언트가 보낸 헤더를 믿지 않음).
    map $http_x_forwarded_proto $ject_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
