# JECT 공통 nginx.conf (운영 진입점과 개발 게이트웨이 공용)
user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # 쿼리 문자열·쿠키·Authorization·본문을 남기지 않는다. $uri는 쿼리를 제외한 정규화 경로다.
    # 경로 자체에 토큰을 넣는 API(공유 링크 등)는 앱 설계 때 경로 마스킹을 추가한다.
    log_format ject_json escape=json
      '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
      '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout ject_json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 15m;   # 영수증 이미지 업로드 기준 초기값
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Docker 내장 DNS로 컨테이너 이름을 주기적으로 다시 조회한다(앱 컨테이너 교체 후 IP 변경 대응).
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
