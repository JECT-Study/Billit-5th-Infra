# JECT 개발자 서버 접근 대상 (PM·디자이너 제외). 실제 이메일·공개키를 받은 사람만 적용한다.
# 공개키는 본인이 만든 것만 받는다(개인키를 대신 만들거나 받지 않는다).
# public_key: 받은 공개키 파일 경로(로컬 .local/ject-access/<username>.pub, 저장소에 올리지 않음)
# oci_email: OCI 콘솔 계정 초대용 이메일(받기 전에는 비움). 요청 글은 팀원-요청-안내문.md
# 2026-10-15 현재 팀원 4명은 이메일·공개키 미수령 → 계정 없음
