# 재사용 워크플로: Spring(Gradle) 백엔드의 CI 검사 — 코드 스타일(Spotless·ktlint) · 테스트 · 빌드.
# 로컬과 같은 절차: 서비스 컨테이너를 로컬 compose.yaml과 같은 포트(PostgreSQL 15432, Redis 16379)·계정(ject/ject)으로 띄우면
# local 프로필 그대로 테스트가 붙는다. 비밀값을 쓰지 않으므로 PR(포크 포함)에서도 돈다.
name: gradle-check

on:
  workflow_call:
    inputs:
      working_directory: { type: string, required: false, default: ".", description: "Gradle 프로젝트 폴더" }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: ject
          POSTGRES_USER: ject
          POSTGRES_PASSWORD: ject
          TZ: Asia/Seoul
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U ject -d ject"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Gradle 캐시 + wrapper 체크섬 검증(gradle-wrapper.jar가 공식 배포본인지 확인)
      - uses: gradle/actions/setup-gradle@v6
      - name: spotlessCheck · test · build
        run: ./gradlew --no-daemon spotlessCheck test build
      - name: 테스트 보고서(실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ${{ inputs.working_directory }}/build/reports/
          retention-days: 7
