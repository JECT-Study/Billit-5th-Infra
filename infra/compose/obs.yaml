# 개발·모니터링 VM(ject-dev-obs)의 관측 스택: Prometheus(14일)·Loki(7일)·Grafana·쓰기 게이트웨이.
# 실행: docker compose -p ject-obs -f /opt/ject/compose/obs.yaml --env-file /etc/ject/host.env up -d
# - Prometheus·Loki는 127.0.0.1에만 publish(같은 VM의 Grafana·Alloy용). 다른 VM은 obs-gateway의 쓰기 경로로만 들어온다.
# - Grafana는 호스트 네트워크 127.0.0.1:3000. 외부 공개 없음 → 관리자는 Bastion 터널로 접속(infra/README.md 「모니터링」).
# - 개발 앱 배포(ject-dev)와 다른 프로젝트라 개발 배포가 모니터링을 재시작하지 않는다.
name: ject-obs

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    user: "65534:65534"
    mem_limit: 768m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-remote-write-receiver
      - --web.listen-address=:9090
    volumes:
      - /etc/ject/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /srv/ject/observability/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [ject-obs-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: 768m
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - /etc/ject/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - /srv/ject/observability/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [ject-obs-net]
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    user: "472:472"
    network_mode: host
    mem_limit: 384m
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Seoul
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
    secrets: [grafana_admin_password]
    volumes:
      - /srv/ject/observability/grafana:/var/lib/grafana
      - /etc/ject/grafana/provisioning:/etc/grafana/provisioning:ro
      - /etc/ject/grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging: *logging

  # 운영 VM Alloy의 쓰기 전용 입구(메트릭 9090 /api/v1/write, 로그 3100 /loki/api/v1/push). 사설 IP에만 바인딩, NSG로 운영 VM만.
  obs-gateway:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /etc/ject/obs-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ject/obs-gateway/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${DEV_BIND_IP:?}:9090:9090"
      - "${DEV_BIND_IP:?}:3100:3100"
    networks: [ject-obs-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8099/nginx-health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logging

secrets:
  grafana_admin_password:
    file: /srv/ject/secrets/grafana_admin_password

networks:
  ject-obs-net:
    name: ject-obs-net
