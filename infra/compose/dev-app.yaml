# 개발 VM의 개발 앱. 이미지 참조는 /srv/ject/dev/release.env(배포 스크립트 관리).
# 운영 DB·Redis 주소와 비밀값을 넣지 않는다(개발 DB만 사용).
name: ject-dev

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  be:
    image: ${JECT_BE_IMAGE:?}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1024m
    # 0.30에서는 기동이 115초라 배포 대기(180초)·상태 검사 여유가 적었다. 0.50에서 67초, 추적 에이전트를 붙여도 88초(2026-11-26 실측).
    cpus: 0.50
    env_file:
      - /srv/ject/secrets/dev-be.env
      - path: /srv/ject/secrets/dev-be-auth.env   # 소셜 로그인·JWT 값. setup-secrets.sh가 덮어쓰지 않게 따로 둔다
        required: false
      # 추적(선택): 이 파일이 있으면 OTel Java 에이전트를 붙인다. 지우고 다시 배포하면 꺼진다(observability/otel/README.md).
      - path: /etc/ject/dev-be-otel.env
        required: false
    environment:
      APP_ENV: dev
      SPRING_PROFILES_ACTIVE: dev
      PORT: "8080"
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError"
    secrets: [redis_password]
    volumes:
      - /opt/ject/otel/agent:/otel:ro
    networks: [ject-dev-net]
    # 관리 포트 8081(/actuator/prometheus)은 호스트 루프백에만 연다(같은 VM의 Alloy만 수집).
    ports:
      - "127.0.0.1:18081:8081"
    logging: *logging

  fe:
    image: ${JECT_FE_IMAGE:-busybox:stable}
    profiles: [fe]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.20
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [ject-dev-net]
    logging: *logging

secrets:
  redis_password:
    file: /srv/ject/secrets/app_redis_password

networks:
  ject-dev-net:
    name: ject-dev-net
    external: true
