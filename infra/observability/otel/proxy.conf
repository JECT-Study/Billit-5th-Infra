# Host loopback ingress only. Fixed internal upstreams; never a forward proxy.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;
  client_body_buffer_size 16k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_header_timeout 5s;
  client_body_timeout 5s;
  send_timeout 10s;
  keepalive_timeout 5s;
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 30s;
  proxy_max_temp_file_size 0;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $proxy_host;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  upstream tempo_query {
    zone tempo_query 32k;
    server tempo:3200 resolve;
  }
  upstream trace_ingest {
    zone trace_ingest 32k;
    server collector:4318 resolve;
  }
  upstream collector_health {
    zone collector_health 32k;
    server collector:12345 resolve;
  }
  server {
    listen 3200;
    location = /ready {
      limit_except GET { deny all; }
      proxy_pass http://tempo_query;
    }
    location /api/ {
      limit_except GET { deny all; }
      proxy_pass http://tempo_query;
    }
    location / { return 404; }
  }
  server {
    listen 4318;
    location = /v1/traces {
      limit_except POST { deny all; }
      proxy_pass http://trace_ingest;
    }
    location / { return 404; }
  }
  server {
    listen 12346;
    location = /-/ready {
      limit_except GET { deny all; }
      proxy_pass http://collector_health;
    }
    location = /-/healthy {
      limit_except GET { deny all; }
      proxy_pass http://collector_health;
    }
    location = /metrics {
      limit_except GET { deny all; }
      proxy_pass http://collector_health;
    }
    location / { return 404; }
  }
}
