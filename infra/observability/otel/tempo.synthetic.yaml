# Tempo 3.1.1 합성 격리 시험용. 운영 설치 설정이 아니다.
# 내부 Docker network에서만 접근하며 호스트 포트를 publish하지 않는다.
target: all
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
