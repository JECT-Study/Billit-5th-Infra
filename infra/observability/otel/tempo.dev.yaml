# Tempo 3.1.1, 개발 인프라 opt-in. 저장 경로는 전용 1GiB 이하 파일시스템 필수.
target: all
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
backend_worker:
  compaction:
    block_retention: 6h
    compacted_block_retention: 10m
    max_block_bytes: 16777216
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 4096
      burst_size_bytes: 1048576
      max_traces_per_user: 100
    global:
      max_bytes_per_trace: 262144
usage_report:
  reporting_enabled: false
