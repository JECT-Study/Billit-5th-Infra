# 생성 파일: infra/observability/grafana/generate.py 로 다시 만든다(직접 수정 금지).
apiVersion: 1
groups:
  - orgId: 1
    name: "ject-infra"
    folder: "JECT"
    interval: "1m"
    rules:
      - uid: "ject-host-down"
        title: "서버 지표 끊김"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(label_replace(vector(1), \"host\", \"prod-app\", \"\", \"\") or label_replace(vector(1), \"host\", \"prod-data\", \"\", \"\") or label_replace(vector(1), \"host\", \"dev\", \"\", \"\")) unless on(host) (last_over_time(up{job=\"node\"}[2m]) == 1)"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "2m"
        labels:
          severity: "critical"
        annotations:
          summary: "{{ $labels.host }} 서버의 지표가 2분 넘게 들어오지 않습니다"
          description: "VM 정지, Alloy·Node Exporter 중지, 개발·모니터링 VM으로 가는 네트워크(NSG 9090) 문제일 수 있습니다. docker compose -p ject-agent ps, OCI 콘솔 인스턴스 상태를 확인하세요."
        isPaused: false
      - uid: "ject-disk-80"
        title: "디스크 80% 초과"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 80
        noDataState: "OK"
        execErrState: "Alerting"
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.host }} 디스크 사용률 {{ $values.A.Value }}%"
          description: "로그·이미지·DB 증가량을 확인하세요(docker system df, du -sh /srv/ject/*). 무료 블록 200GB를 다 써서 디스크를 늘릴 수 없습니다."
        isPaused: false
      - uid: "ject-disk-90"
        title: "디스크 90% 초과"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 90
        noDataState: "OK"
        execErrState: "Alerting"
        for: "2m"
        labels:
          severity: "critical"
        annotations:
          summary: "{{ $labels.host }} 디스크 사용률 {{ $values.A.Value }}% (긴급)"
          description: "배포는 여유 15% 미만에서 거부됩니다. 오래된 이미지·로그를 정리하세요(실행·복구용 이미지는 남김)."
        isPaused: false
      - uid: "ject-memory-low"
        title: "가용 메모리 15% 미만"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 15
        noDataState: "OK"
        execErrState: "Alerting"
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.host }} 가용 메모리 {{ $values.A.Value }}%"
          description: "컨테이너별 사용량(docker stats --no-stream)과 메모리 상한을 확인하세요."
        isPaused: false
      - uid: "ject-cpu-high"
        title: "CPU 85% 초과(10분)"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "100 * (1 - avg by(host) (sum by(host, cpu) (rate(node_cpu_seconds_total{mode=~\"idle|iowait\"}[5m]))))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 85
        noDataState: "OK"
        execErrState: "Alerting"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.host }} CPU 사용률 {{ $values.A.Value }}%"
          description: "VM당 1 OCPU입니다. 개발 앱·백업·부하 시험이 겹쳤는지 확인하세요."
        isPaused: false
  - orgId: 1
    name: "ject-backup"
    folder: "JECT"
    interval: "1m"
    rules:
      - uid: "ject-backup-failed"
        title: "운영 DB 백업 실패"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "1 - ject_backup_last_run_success"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "0s"
        labels:
          severity: "critical"
        annotations:
          summary: "운영 DB 백업이 실패했습니다"
          description: "운영 데이터 VM: sudo cat /srv/ject/backup-status/last.json, journalctl -u ject-pg-backup. 고친 뒤 sudo systemctl start ject-pg-backup 으로 다시 실행하세요."
        isPaused: false
      - uid: "ject-backup-stale"
        title: "운영 DB 백업 26시간 넘게 성공 없음"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "((time() - ject_backup_last_success_timestamp_seconds) / 3600) or on() (999 * (absent(ject_backup_last_success_timestamp_seconds) and on() (count(last_over_time(up{job=\"node\", host=\"prod-data\"}[2m]) == 1) > 0)))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 26
        noDataState: "OK"
        execErrState: "Alerting"
        for: "0s"
        labels:
          severity: "critical"
        annotations:
          summary: "마지막 백업 성공 후 {{ $values.A.Value }}시간(999는 백업 지표 없음)"
          description: "매일 04:00 KST 백업이 돌지 않았거나 실패했습니다. ject-pg-backup.timer와 백업 지표 파일(/var/lib/ject/textfile)을 확인하세요."
        isPaused: false
      - uid: "ject-restore-test-failed"
        title: "백업 복원 시험 실패"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "1 - ject_restore_test_last_run_success"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "0s"
        labels:
          severity: "critical"
        annotations:
          summary: "월간 백업 복원 시험이 실패했습니다"
          description: "운영 데이터 VM: sudo cat /srv/ject/backup-status/restore-last.json, journalctl -u ject-pg-restore-test."
        isPaused: false
  - orgId: 1
    name: "ject-restore-freshness"
    folder: "JECT"
    interval: "1m"
    rules:
      - uid: "ject-restore-test-stale"
        title: "월간 복원 시험 오래됨 또는 지표 누락"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(up{job=\"node\",host=\"prod-data\"} == 1 and (time() - timestamp(up{job=\"node\",host=\"prod-data\"}) < 180)) unless on(host) (ject_restore_test_last_run_timestamp_seconds{job=\"node\",host=\"prod-data\"} > 0 and (time() - ject_restore_test_last_run_timestamp_seconds{job=\"node\",host=\"prod-data\"} <= 32 * 86400) and (ject_restore_test_last_run_timestamp_seconds{job=\"node\",host=\"prod-data\"} <= time()) and (time() - timestamp(ject_restore_test_last_run_timestamp_seconds{job=\"node\",host=\"prod-data\"}) < 180))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: "월간 복원 시험 기록이 오래되었거나 유효한 지표가 없습니다"
          description: "초기값: 매월1일05시KST 일정에 대해 최대32일 경과를 감시합니다. 정확한 월별 실행기한 감시는 아니며 짧은 달에는 탐지가 늦습니다. 지표 누락·180초 이상 오래된 표본·미래 시각도 경고합니다. ject-pg-restore-test.timer와 restore-last.json을 읽기 전용으로 확인하세요. 최근 실행은 복원 성공 증거가 아니며 기존 실패 경보를 함께 확인합니다."
        isPaused: false
  - orgId: 1
    name: "ject-external"
    folder: "JECT"
    interval: "1m"
    rules:
      - uid: "ject-probe-fail"
        title: "공인 주소 접속 실패"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(min by(target) (probe_success{job=~\"integrations/blackbox/(dev|prod)\",host=\"dev\",target=~\"dev|prod\"} and (time() - timestamp(probe_success{job=~\"integrations/blackbox/(dev|prod)\",host=\"dev\",target=~\"dev|prod\"}) < 180))) or on(target) (label_replace(vector(0), \"target\", \"dev\", \"\", \"\") or label_replace(vector(0), \"target\", \"prod\", \"\", \"\"))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
        noDataState: "OK"
        execErrState: "Alerting"
        for: "3m"
        labels:
          severity: "critical"
        annotations:
          summary: "{{ $labels.target }} 공인 주소(/readyz) 접속 실패"
          description: "개발·모니터링 VM에서 NAT를 거쳐 공인 HTTPS 주소를 1분마다 시험합니다. 대상별 실패·누락·180초 이상 오래된 표본을 감지합니다. 운영 Nginx·인증서·앱 readiness(DB·Redis)를 확인하세요. OCI Health Checks는 무료가 아니어서 이 시험으로 대신합니다."
        isPaused: false
      - uid: "ject-cert-expiry"
        title: "인증서 만료 14일 이내"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(probe_ssl_earliest_cert_expiry - time()) / 86400"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 14
        noDataState: "OK"
        execErrState: "Alerting"
        for: "0s"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.target }} 인증서 만료까지 {{ $values.A.Value }}일"
          description: "자동 갱신(ject-certbot-renew.timer, 만료 30일 전부터 시도)이 실패하고 있습니다. sudo /opt/ject/bin/ject-cert renew 로그를 확인하세요."
        isPaused: false
  - orgId: 1
    name: "ject-observability"
    folder: "JECT"
    interval: "1m"
    rules:
      - uid: "ject-obs-component-down"
        title: "관측 도구 수집 실패 또는 누락"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(label_replace(label_replace(vector(1), \"host\", \"dev\", \"\", \"\"), \"component\", \"grafana\", \"\", \"\") or label_replace(label_replace(vector(1), \"host\", \"dev\", \"\", \"\"), \"component\", \"loki\", \"\", \"\") or label_replace(label_replace(vector(1), \"host\", \"dev\", \"\", \"\"), \"component\", \"prometheus\", \"\", \"\")) unless on(host,component) (up{job=\"obs\",host=\"dev\",component=~\"grafana|loki|prometheus\"} == 1 and (time() - timestamp(up{job=\"obs\",host=\"dev\",component=~\"grafana|loki|prometheus\"}) < 180)) and on(host) (up{job=\"node\",host=\"dev\"} == 1 and (time() - timestamp(up{job=\"node\",host=\"dev\"}) < 180))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "2m"
        labels:
          severity: "critical"
        annotations:
          summary: "{{ $labels.component }} 관측 지표 수집 실패"
          description: "초기값: 180초 신선도와 2분 지속을 확인합니다. 개발 노드 지표가 살아 있을 때만 울립니다. Grafana/Prometheus 자체가 완전히 멈추면 이 내부 경보도 전달하지 못하므로 OCI 직접 이메일 경로를 유지합니다."
        isPaused: false
      - uid: "ject-metrics-write-failed"
        title: "메트릭 전송 실패 증가"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "sum by(host) (increase(prometheus_remote_storage_samples_failed_total{job=\"integrations/self\",host=~\"dev|prod-app|prod-data\"}[5m])) and on(host) (up{job=\"node\",host=~\"dev|prod-app|prod-data\"} == 1 and (time() - timestamp(up{job=\"node\",host=~\"dev|prod-app|prod-data\"}) < 180))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "2m"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.host }} 메트릭 전송 실패 증가"
          description: "초기값: 최근 5분 실패 증가가 2분 지속될 때 확인합니다. Alloy remote-write·인증·수신기 상태를 확인하세요. 노드 미수집은 서버 지표 끊김 경보가 담당하며, 이 규칙만으로 모든 전송 손실을 보장하지 않습니다."
        isPaused: false
      - uid: "ject-logs-write-dropped"
        title: "로그 전송 폐기 증가"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "sum by(host) (increase(loki_write_dropped_entries_total{job=\"integrations/self\",host=~\"dev|prod-app|prod-data\"}[5m])) and on(host) (up{job=\"node\",host=~\"dev|prod-app|prod-data\"} == 1 and (time() - timestamp(up{job=\"node\",host=~\"dev|prod-app|prod-data\"}) < 180))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "2m"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.host }} Loki 전송 로그 폐기 증가"
          description: "초기값: 최근 5분 폐기 증가가 2분 지속될 때 확인합니다. Loki 수신 제한·인증·전송 오류를 확인하고 원본 로그를 알림에 복사하지 않습니다. 정상 마스킹/drop 처리와 전송 실패 카운터를 구분합니다."
        isPaused: false
  - orgId: 1
    name: "ject-app"
    folder: "JECT"
    interval: "1m"
    rules:
      - uid: "ject-app-down"
        title: "앱 지표 끊김"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(label_replace(vector(1), \"host\", \"prod-app\", \"\", \"\") or label_replace(vector(1), \"host\", \"dev\", \"\", \"\")) unless on(host) (last_over_time(up{job=\"app\"}[2m]) == 1)"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Alerting"
        for: "3m"
        labels:
          severity: "critical"
        annotations:
          summary: "{{ $labels.host }} 앱(관리 포트 8081 /actuator/prometheus) 응답 없음"
          description: "앱 컨테이너가 멈췄거나 재시작 중입니다. sudo /opt/ject/bin/ject-deploy status, docker logs로 확인하세요."
        isPaused: false
      - uid: "ject-http-5xx"
        title: "HTTP 5xx 비율 5% 초과"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "(sum by(host) (rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / sum by(host) (rate(http_server_requests_seconds_count[5m]))) and on(host) (sum by(host) (increase(http_server_requests_seconds_count[5m])) >= 20)"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.05
        noDataState: "OK"
        execErrState: "Alerting"
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: "{{ $labels.host }} 5xx 비율 {{ $values.A.Value }}"
          description: "최근 배포·앱 오류 로그(Grafana 「JECT 로그」)·DB 상태를 확인하세요."
        isPaused: false
      - uid: "ject-latency-p95"
        title: "응답 p95 1초 초과"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prom"
            model:
              refId: "A"
              expr: "histogram_quantile(0.95, sum by(le, host) (rate(http_server_requests_seconds_bucket{uri!~\"/actuator.*|/readyz|/healthz\"}[5m])))"
              instant: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 1
        noDataState: "OK"
        execErrState: "Alerting"
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: "{{ $labels.host }} p95 {{ $values.A.Value }}초"
          description: "CPU·DB·외부 호출을 확인하세요. OCR 같은 장시간 API는 별도 기준이 필요합니다."
        isPaused: false
      - uid: "ject-db-pool-pending"
        title: "DB 커넥션 대기"
