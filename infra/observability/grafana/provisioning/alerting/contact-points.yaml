# Grafana 알림 → 같은 VM의 ject-alert-relay(127.0.0.1:9095) → OCI Notifications 주제 ject-alerts → 이메일.
# 이메일 주소는 OCI 구독에만 있다(저장소에 두지 않음). 중계기는 인스턴스 주체로 그 주제에만 발행할 수 있다.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: ject-oci-email
    receivers:
      - uid: ject-relay
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://127.0.0.1:9095/grafana
          httpMethod: POST
policies:
  - orgId: 1
    receiver: ject-oci-email
    group_by: [grafana_folder, alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
