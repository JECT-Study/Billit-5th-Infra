# Grafana(호스트 네트워크, 127.0.0.1:3000)는 같은 VM의 Prometheus·Loki를 루프백으로 읽는다.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false
    jsonData:
      # 개발 BE 로그의 trace_id에서 Tempo 추적으로 넘어간다(추적 저장소는 선택 설치, observability/otel).
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: ject-tempo-dev
          url: '$${__value.raw}'
          urlDisplayLabel: 추적 보기
