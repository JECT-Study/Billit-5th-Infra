# 개발·모니터링 VM의 관측 쓰기 게이트웨이(ject-obs 프로젝트). 운영 VM의 Alloy만 NSG로 허용된다.
# 쓰기 경로 2개만 Basic 인증으로 연다. 조회 API(메트릭·로그 읽기)는 이 경로로 열지 않는다(Grafana는 127.0.0.1로 직접).
# 비밀번호: /srv/ject/secrets/obs_push_password (setup-secrets.sh obs), 해시: obs.htpasswd
server {
    listen 9090;
    server_name _;
    access_log off;
    location = /api/v1/write {
        auth_basic "ject-obs";
        auth_basic_user_file /etc/nginx/conf.d/obs.htpasswd;
        client_max_body_size 16m;
        set $up prometheus:9090;
        proxy_pass http://$up;
        proxy_set_header Authorization "";
    }
    location / { return 404; }
}

server {
    listen 3100;
    server_name _;
    access_log off;
    location = /loki/api/v1/push {
        auth_basic "ject-obs";
        auth_basic_user_file /etc/nginx/conf.d/obs.htpasswd;
        client_max_body_size 16m;
        set $up loki:3100;
        proxy_pass http://$up;
        proxy_set_header Authorization "";
    }
    location / { return 404; }
}

server {
    listen 8099;
    server_name _;
    access_log off;
    location = /nginx-health { return 200 "ok\n"; }
}
