# 모든 환경 공통 설정. 환경별 값은 application-<local|dev|prod>.yml.
# 프로필은 APP_ENV로 정한다: 서버의 Compose가 APP_ENV=dev / prod를 넣고, 로컬은 값이 없어 local이 된다.
spring:
  application:
    name: tripsheet
  profiles:
    active: ${APP_ENV:local}
  config:
    # 서버에서는 Compose secret 파일(/run/secrets/<이름>)을 같은 이름의 속성으로 읽는다(예: redis_password).
    # 로컬에는 이 폴더가 없어도 된다(optional).
    import: "optional:configtree:/run/secrets/"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway만 바꾼다(src/main/resources/db/migration/V<번호>__<설명>.sql)
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  datasource:
    hikari:
      # DB가 죽었을 때 요청·/readyz가 오래 매달리지 않게 한다(기본 30초).
      connection-timeout: 5000   # 밀리초(Hikari는 "5s" 형식을 받지 않는다)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${redis_password:}  # 서버: /run/secrets/redis_password, 로컬: 없음
      # Redis가 죽었을 때 /readyz가 바로 503을 주게 한다(기본값은 수십 초 대기).
      timeout: 2s
      connect-timeout: 2s
  lifecycle:
    timeout-per-shutdown-phase: 20s   # 서버 Compose의 stop_grace_period(30s) 안에서 끝낸다

server:
  port: ${PORT:8080}
  shutdown: graceful
  # 서버에서는 Nginx 뒤에 있다. X-Forwarded-Proto를 믿어야 리다이렉트·링크가 https로 만들어진다.
  forward-headers-strategy: native

management:
  server:
    port: 8081                    # actuator는 별도 포트(서버는 호스트 127.0.0.1:18081로만 연다). Nginx도 /actuator를 막는다.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # prometheus: 서버의 Alloy가 30초마다 수집 → Grafana
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 응답 시간 p95를 서버에서 계산할 구간(SLO 버킷). 전체 히스토그램보다 시계열 수가 훨씬 적다.
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s,5s
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 서버 배포 스크립트(ject-deploy)와 Nginx가 앱 포트의 /readyz를 확인한다. DB·Redis가 붙어야 200.
        readiness:
          include: readinessState,db,redis
          additional-path: "server:/readyz"
        # 컨테이너 HEALTHCHECK가 /healthz를 본다(프로세스 생존만, 외부 의존 없음).
        liveness:
          include: livenessState
          additional-path: "server:/healthz"

# API 문서(Swagger, 팀 명세 "임시 사용"): 기본은 끔. 로컬·개발 프로필에서만 켠다(application-local/dev.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
