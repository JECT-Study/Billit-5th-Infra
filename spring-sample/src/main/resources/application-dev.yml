# 개발 서버(APP_ENV=dev). 접속 정보는 서버가 환경변수로 넣는다(저장소에 두지 않는다):
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD  (개발 전용 DB ject_dev)
#   REDIS_HOST / REDIS_PORT, /run/secrets/redis_password
# 앱 전용 비밀값(로그인 키 등)이 생기면 인프라 담당에게 요청한다(서버의 /srv/ject/secrets/dev-be.env).
logging:
  structured:
    format:
      console: ecs   # 한 줄 JSON 로그(서버에서 검색·수집하기 쉬움)
  level:
    com.ject: debug

# API 문서: 로컬 http://localhost:8080/swagger-ui.html, 개발 서버 https://<개발 도메인>/swagger-ui.html(Basic 인증)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
