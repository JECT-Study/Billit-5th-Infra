# 로컬 개발용 PostgreSQL·Redis (BE 저장소 루트에 compose.yaml로 둔다).
#
# - `./gradlew bootRun` 또는 IDE 실행(local 프로필)이면 Spring Boot Docker Compose 지원
#   (build.gradle.kts의 developmentOnly("org.springframework.boot:spring-boot-docker-compose"))이
#   이 파일을 자동으로 띄우고 접속 정보를 연결한다. 따로 할 일이 없다.
# - 직접 띄우기: docker compose up -d   /  끄기: docker compose down   /  데이터까지 지우기: docker compose down -v
# - 버전은 서버(운영·개발)와 같다. 값은 로컬 전용이라 비밀값이 아니다.
# - 호스트 포트는 15432·16379다. PC에 PostgreSQL·Redis가 따로 설치돼 있으면 기본 포트(5432·6379)가 겹쳐
#   앱이 엉뚱한 DB에 붙는다(실제로 겪음). DB 도구(DBeaver 등)는 localhost:15432, 계정 ject / ject로 접속한다.
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ject
      POSTGRES_USER: ject
      POSTGRES_PASSWORD: ject
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ject -d ject"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
