# 재사용 워크플로: linux/arm64 이미지를 빌드해 GHCR에 커밋 SHA 태그로 올리고 digest를 출력한다.
# 공개 저장소는 ARM64 호스티드 러너(ubuntu-24.04-arm)를, 비공개 저장소는 QEMU 에뮬레이션을 쓴다(runner 입력).
name: build-arm64

on:
  workflow_call:
    inputs:
      context:    { type: string, required: false, default: . }
      dockerfile: { type: string, required: false, default: Dockerfile }
      image_name: { type: string, required: true, description: "예: ject-be (ghcr.io/<owner>/<image_name>)" }
      runner:     { type: string, required: false, default: ubuntu-24.04-arm }
    outputs:
      image:
        description: "ghcr.io/<owner>/<name>@sha256:..."
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (x86 러너일 때만 필요)
        if: ${{ !endsWith(inputs.runner, '-arm') }}
        uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.repo }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: out
        run: echo "image=${{ steps.meta.outputs.repo }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
